[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-metrics"
version = "0.4.0"
description = "APK-level Android quality metric extraction for MOSAIC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "androguard>=4.0",
  "click>=8.0",
  "loguru>=0.7",
  "jinja2>=3.1",
]

[project.scripts]
mosaic = "mosaic.cli:main"

[tool.setuptools.package-data]
mosaic = ["templates/*.html"]
